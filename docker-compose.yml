version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: business_standart_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: business_standart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: business_standart_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: business_standart_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery worker: обрабатывает фоновые задачи (обновление курсов валют, уведомления)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: business_standart_celery_worker
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      celery -A app.celery_app worker
        --loglevel=info
        --concurrency=2
        --queues=celery
    restart: unless-stopped

  # Celery Beat: планировщик задач (запускает обновление курсов в 09:00 Ташкент)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: business_standart_celery_beat
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - celery_beat_data:/app/celerybeat-schedule
    command: >
      celery -A app.celery_app beat
        --loglevel=info
        --scheduler celery.beat:PersistentScheduler
        --schedule /app/celerybeat-schedule/celerybeat-schedule
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  celery_beat_data:
